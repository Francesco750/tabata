<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>HIIT Tabata ~17'</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Azeret+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --c:    #FFD600;
  --bg:   #06060a;
  --s1:   #0c0c12;
  --s2:   #16161f;
  --text: #eeeef4;
  --dim:  #3a3a52;
  --r:    14px;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; background:var(--bg); color:var(--text); font-family:'Azeret Mono',monospace; overflow:hidden; }

#app {
  height: 100svh; display:flex; flex-direction:column;
  max-width:430px; margin:0 auto;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  gap:8px;
}

/* ── HEADER ── */
.hdr { display:flex; justify-content:space-between; align-items:center; padding-bottom:8px; border-bottom:1px solid var(--s2); flex-shrink:0; }
.hdr-logo { font-family:'Bebas Neue',sans-serif; font-size:1.05rem; letter-spacing:.2em; color:var(--c); transition:color .4s; }
.hdr-meta { font-size:.58rem; letter-spacing:.1em; color:var(--dim); text-align:right; line-height:1.6; }

/* ── TIMER RING ── */
.timer-wrap { display:flex; justify-content:center; flex-shrink:0; }
.ring-outer { position:relative; width:clamp(148px,40vw,180px); height:clamp(148px,40vw,180px); }
#ring-svg { width:100%; height:100%; transform:rotate(-90deg); }
.r-bg { fill:none; stroke:var(--s2); stroke-width:8; }
.r-fg { fill:none; stroke:var(--c); stroke-width:8; stroke-linecap:round; stroke-dasharray:276.46; stroke-dashoffset:0; transition:stroke .4s, stroke-dashoffset .95s linear; }
.ring-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
#phase-lbl { font-family:'Bebas Neue',sans-serif; font-size:.72rem; letter-spacing:.3em; color:var(--c); transition:color .4s; }
#count-num { font-family:'Bebas Neue',sans-serif; font-size:clamp(2.9rem,10vw,3.7rem); line-height:1; }
#count-num.pulse { animation:numPulse .4s ease-in-out infinite alternate; }
@keyframes numPulse { to { opacity:.35; } }
#next-lbl { font-size:.46rem; letter-spacing:.1em; color:var(--dim); margin-top:4px; text-align:center; }

/* ── EXERCISE CARD ── */
.ex-card { flex:1 1 0; min-height:0; background:var(--s1); border:1px solid var(--s2); border-radius:var(--r); padding:10px 14px; display:flex; align-items:center; gap:12px; }
/* color:var(--c) → currentColor in SVG resolves correctly */
.fig-wrap { width:70px; height:70px; flex-shrink:0; color:var(--c); transition:color .4s; }
.fig-wrap svg { width:100%; height:100%; overflow:visible; display:block; }
.ex-info { flex:1; min-width:0; }
.ex-name { font-family:'Bebas Neue',sans-serif; font-size:1.3rem; letter-spacing:.04em; line-height:1.1; }
.ex-sub  { font-size:.54rem; letter-spacing:.13em; color:var(--dim); margin-top:4px; }
.ex-hint { font-size:.5rem; letter-spacing:.1em; color:var(--c); margin-top:2px; transition:color .4s; }

/* ── DOTS (18 rounds) ── */
.dots { display:flex; gap:3px; flex-shrink:0; flex-wrap:wrap; justify-content:center; }
.dot { flex:1; max-width:18px; height:5px; border-radius:3px; background:var(--s2); transition:background .3s; }
.dot.done   { background:var(--dim); }
.dot.active { background:var(--c); }

/* ── CONTROLS ── */
.ctrls { display:flex; gap:7px; flex-shrink:0; }
#btn-main { flex:1; height:50px; font-family:'Bebas Neue',sans-serif; font-size:1.2rem; letter-spacing:.12em; background:var(--c); color:#000; border:none; border-radius:var(--r); cursor:pointer; transition:background .4s, transform .1s; }
#btn-main:active { transform:scale(.97); }
#btn-main:disabled { opacity:.45; pointer-events:none; }
.btn-sq { width:50px; height:50px; flex-shrink:0; font-family:'Bebas Neue',sans-serif; background:var(--s1); color:var(--dim); border:1px solid var(--s2); border-radius:var(--r); cursor:pointer; transition:color .2s, border-color .2s; font-size:.85rem; letter-spacing:.06em; display:flex; align-items:center; justify-content:center; }
.btn-sq:hover { color:var(--text); }
.btn-sq:disabled { opacity:.35; pointer-events:none; }
#btn-skip { width:72px; font-size:.7rem; letter-spacing:.08em; color:var(--text); border-color:var(--dim); }
#btn-skip:not(:disabled):hover { border-color:var(--c); color:var(--c); }

/* ── NEXT badge on card during rest ── */
.ex-card { position:relative; }
.next-badge { position:absolute; top:8px; right:10px; font-family:'Bebas Neue',sans-serif; font-size:.62rem; letter-spacing:.14em; padding:2px 8px; border-radius:20px; background:var(--c); color:#000; transition:opacity .3s; }

/* ── SETTINGS PANEL ── */
#set-panel { display:none; position:fixed; inset:0; z-index:80; background:var(--bg); flex-direction:column; }
#set-panel.show { display:flex; animation:slideUp .3s cubic-bezier(.22,1,.36,1); }
.sp-body { flex:1; overflow-y:auto; padding:20px 16px; display:flex; flex-direction:column; gap:20px; }
.sp-row { display:flex; flex-direction:column; gap:8px; }
.sp-label { font-family:'Bebas Neue',sans-serif; font-size:.85rem; letter-spacing:.18em; color:var(--dim); }
.sp-val { font-family:'Bebas Neue',sans-serif; font-size:2rem; color:var(--c); text-align:center; }
.sp-range { width:100%; accent-color:var(--c); height:4px; cursor:pointer; }
.sp-apply { margin:8px 16px 16px; height:50px; font-family:'Bebas Neue',sans-serif; font-size:1.1rem; letter-spacing:.12em; background:var(--c); color:#000; border:none; border-radius:var(--r); cursor:pointer; flex-shrink:0; }
.sp-note { font-size:.52rem; letter-spacing:.1em; color:var(--dim); text-align:center; margin-top:-8px; }

/* ── EXERCISES PANEL ── */
#ex-panel { display:none; position:fixed; inset:0; z-index:80; background:var(--bg); flex-direction:column; }
#ex-panel.show { display:flex; animation:slideUp .3s cubic-bezier(.22,1,.36,1); }
@keyframes slideUp { from { transform:translateY(100%); } to { transform:none; } }
.ep-header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px 12px; border-bottom:1px solid var(--s2); flex-shrink:0; }
.ep-title { font-family:'Bebas Neue',sans-serif; font-size:1.1rem; letter-spacing:.18em; color:var(--c); }
.ep-close { width:36px; height:36px; border-radius:50%; background:var(--s2); border:none; color:var(--text); font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.ep-list { flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch; }
.ep-item { background:var(--s1); border:1px solid var(--s2); border-radius:var(--r); padding:12px 14px; display:flex; align-items:center; gap:12px; transition:border-color .3s; }
.ep-item.ep-current { border-color:var(--c); }
.ep-item.ep-done    { opacity:.45; }
.ep-fig { width:60px; height:60px; flex-shrink:0; color:var(--c); }
.ep-fig svg { width:100%; height:100%; overflow:visible; display:block; }
.ep-info { flex:1; }
.ep-name { font-family:'Bebas Neue',sans-serif; font-size:1.15rem; letter-spacing:.04em; line-height:1.1; }
.ep-meta { font-size:.52rem; letter-spacing:.1em; color:var(--dim); margin-top:4px; }
.ep-badge { font-family:'Bebas Neue',sans-serif; font-size:.65rem; letter-spacing:.1em; padding:3px 8px; border-radius:20px; background:var(--c); color:#000; flex-shrink:0; }
.ep-badge.done-badge { background:var(--dim); color:var(--bg); }

/* ── 3-2-1 ── */
#go-ov { display:none; position:fixed; inset:0; background:rgba(6,6,10,.93); flex-direction:column; align-items:center; justify-content:center; z-index:50; gap:6px; }
#go-ov.show { display:flex; }
#go-n { font-family:'Bebas Neue',sans-serif; font-size:clamp(5rem,22vw,8rem); color:var(--c); line-height:1; animation:popIn .4s cubic-bezier(.34,1.56,.64,1); }
@keyframes popIn { from { transform:scale(.5); opacity:0; } to { transform:scale(1); opacity:1; } }
.go-sub { font-family:'Bebas Neue',sans-serif; letter-spacing:.22em; color:var(--dim); font-size:.85rem; }

/* ── DONE ── */
#done-sc { display:none; position:fixed; inset:0; background:var(--bg); flex-direction:column; align-items:center; justify-content:center; z-index:100; gap:8px; }
#done-sc.show { display:flex; animation:riseIn .5s ease; }
@keyframes riseIn { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:none; } }
.done-icon { font-size:3rem; }
.done-t { font-family:'Bebas Neue',sans-serif; font-size:clamp(2.2rem,10vw,3.5rem); color:var(--c); }
.done-s { font-size:.62rem; letter-spacing:.16em; color:var(--dim); }
.done-stat { font-size:.7rem; letter-spacing:.1em; color:var(--text); margin-top:4px; }
#btn-again { margin-top:20px; padding:0 28px; height:50px; font-family:'Bebas Neue',sans-serif; font-size:1.15rem; letter-spacing:.1em; background:var(--c); color:#000; border:none; border-radius:var(--r); cursor:pointer; }

/* ── FLASH ── */
#flash { position:fixed; inset:0; pointer-events:none; z-index:200; opacity:0; }
#flash.go { animation:fl .4s ease-out forwards; }
@keyframes fl { 0% { opacity:1; } 100% { opacity:0; } }

/* ── SPOTIFY ── */
#btn-spotify {
  width:100%; height:42px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; gap:8px;
  background:#1DB954; color:#000; border:none; border-radius:var(--r);
  font-family:'Bebas Neue',sans-serif; font-size:1rem; letter-spacing:.12em;
  cursor:pointer; transition:filter .2s, transform .1s;
}
#btn-spotify:hover  { filter:brightness(1.1); }
#btn-spotify:active { transform:scale(.97); }
#btn-spotify svg { width:18px; height:18px; flex-shrink:0; }
</style>
</head>
<body>

<div id="app">
  <div class="hdr">
    <span class="hdr-logo">HIIT TABATA · ~17'</span>
    <div class="hdr-meta">
      <div id="hdr-round">Round 1 / 18</div>
      <div id="hdr-circ" style="color:var(--c);transition:color .4s">Circuito 1 / 3</div>
    </div>
  </div>

  <div class="timer-wrap">
    <div class="ring-outer">
      <svg id="ring-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle class="r-bg" cx="50" cy="50" r="44"/>
        <circle class="r-fg" id="r-fg" cx="50" cy="50" r="44"/>
      </svg>
      <div class="ring-center">
        <div id="phase-lbl">PRONTO</div>
        <div id="count-num">45</div>
        <div id="next-lbl">premi INIZIA</div>
      </div>
    </div>
  </div>

  <div class="ex-card">
    <div class="fig-wrap" id="fig-wrap"></div>
    <div class="ex-info">
      <div class="ex-name" id="ex-name">JUMPING JACKS</div>
      <div class="ex-sub"  id="ex-sub">ESERCIZIO 1 / 6</div>
      <div class="ex-hint" id="ex-hint">45" LAVORO · 15" PAUSA</div>
    </div>
    <div class="next-badge" id="next-badge" style="display:none">PROSSIMO</div>
  </div>

  <div class="dots" id="dots"></div>

  <!-- ── SPOTIFY ── -->
  <button id="btn-spotify" onclick="openSpotify()">
    <!-- Spotify logo SVG -->
    <svg viewBox="0 0 24 24" fill="#000" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.516 17.332a.75.75 0 01-1.031.25c-2.823-1.725-6.376-2.115-10.563-1.159a.75.75 0 01-.334-1.463c4.579-1.045 8.507-.595 11.678 1.341a.75.75 0 01.25 1.031zm1.472-3.27a.937.937 0 01-1.288.308c-3.231-1.986-8.159-2.562-11.982-1.402a.938.938 0 01-.544-1.794c4.369-1.326 9.795-.683 13.506 1.6a.937.937 0 01.308 1.288zm.127-3.408C15.37 8.432 9.396 8.24 6.02 9.261a1.125 1.125 0 01-.652-2.151c3.89-1.18 10.355-.952 14.43 1.625a1.125 1.125 0 01-1.183 1.909z"/>
    </svg>
    APRI PLAYLIST WORKOUT
  </button>

  <div class="ctrls">
    <button id="btn-main" onclick="toggleStart()">&#9654; INIZIA</button>
    <button id="btn-skip" class="btn-sq" onclick="skipPhase()" disabled>SALTA &#9197;</button>
    <button id="btn-list" class="btn-sq" onclick="openPanel()" title="Vedi esercizi">&#9783;</button>
    <button id="btn-settings" class="btn-sq" onclick="openSettings()" title="Impostazioni">&#9881;</button>
    <button id="btn-reset" class="btn-sq" onclick="resetAll()" title="Reset">&#8635;</button>
  </div>
</div>

<!-- SETTINGS PANEL -->
<div id="set-panel">
  <div class="ep-header">
    <span class="ep-title">IMPOSTAZIONI</span>
    <button class="ep-close" onclick="closeSettings()">&#10005;</button>
  </div>
  <div class="sp-body">
    <div class="sp-row">
      <div class="sp-label">TEMPO LAVORO</div>
      <div class="sp-val"><span id="sp-work-val">45</span>"</div>
      <input type="range" class="sp-range" id="sp-work" min="10" max="90" step="5" value="45" oninput="document.getElementById('sp-work-val').textContent=this.value">
      <div class="sp-note">10" – 90"</div>
    </div>
    <div class="sp-row">
      <div class="sp-label">TEMPO PAUSA</div>
      <div class="sp-val"><span id="sp-rest-val">15</span>"</div>
      <input type="range" class="sp-range" id="sp-rest" min="5" max="60" step="5" value="15" oninput="document.getElementById('sp-rest-val').textContent=this.value">
      <div class="sp-note">5" – 60"</div>
    </div>
  </div>
  <button class="sp-apply" onclick="applySettings()">&#10003; APPLICA</button>
</div>

<!-- EXERCISES PANEL -->
<div id="ex-panel">
  <div class="ep-header">
    <span class="ep-title">6 ESERCIZI · 3 CIRCUITI</span>
    <button class="ep-close" onclick="closePanel()">&#10005;</button>
  </div>
  <div class="ep-list" id="ep-list"></div>
</div>

<!-- 3-2-1 -->
<div id="go-ov">
  <div id="go-n">3</div>
  <div class="go-sub">PREPARATI</div>
</div>

<!-- DONE -->
<div id="done-sc">
  <div class="done-icon">&#128293;</div>
  <div class="done-t">OTTIMO!</div>
  <div class="done-s">ALLENAMENTO COMPLETATO</div>
  <div class="done-stat">~17 MIN &middot; 6 ESERCIZI &middot; 3 CIRCUITI</div>
  <button id="btn-again" onclick="resetAll()">&#8635; RICOMINCIA</button>
</div>

<div id="flash"></div>

<script>
/* ════════════════════════════════════
   CONFIG
════════════════════════════════════ */
var REST_T  = 15;
var TOTAL_R = 18; // 6 esercizi × 3 circuiti
var CIRC    = 2 * Math.PI * 44; // 276.46

/* ════════════════════════════════════
   SVG FIGURES
   stroke="currentColor" + parent color:var(--c) in CSS
════════════════════════════════════ */
function mkSVG(body) {
  return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;overflow:visible;display:block">' + body + '</svg>';
}
var SW   = 'stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="3"';
var SWFL = 'stroke="#3a3a52" stroke-linecap="round" fill="none" stroke-width="1.5"';
var E    = '.4 0 .6 1;.4 0 .6 1';

/* 1. Jumping Jacks */
function svgJacks() {
  return mkSVG('<g ' + SW + '>'
    + '<circle cx="50" cy="12" r="7"/>'
    + '<line x1="50" y1="19" x2="50" y2="54"/>'
    + '<line x1="50" y1="29" x2="25" y2="47">'
    +   '<animate attributeName="y2" values="47;9;47"  dur=".65s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'
    +   '<animate attributeName="x2" values="25;22;25" dur=".65s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'
    + '</line>'
    + '<line x1="50" y1="29" x2="75" y2="47">'
    +   '<animate attributeName="y2" values="47;9;47"  dur=".65s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'
    +   '<animate attributeName="x2" values="75;78;75" dur=".65s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'
    + '</line>'
    + '<line x1="50" y1="54" x2="36" y2="83">'
    +   '<animate attributeName="x2" values="36;18;36" dur=".65s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'
    + '</line>'
    + '<line x1="50" y1="54" x2="64" y2="83">'
    +   '<animate attributeName="x2" values="64;82;64" dur=".65s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'
    + '</line>'
    + '</g>');
}

/* 2. Mountain Climbers */
function svgClimbers() {
  return mkSVG(
    '<line x1="5" y1="88" x2="95" y2="88" ' + SWFL + '/>'
    + '<g ' + SW + '>'
    + '<circle cx="80" cy="32" r="7"/>'
    + '<line x1="73" y1="38" x2="20" y2="60"/>'
    + '<line x1="20" y1="60" x2="12" y2="88"/>'
    + '<line x1="28" y1="57" x2="20" y2="88"/>'
    + '<line x1="73" y1="38" x2="88" y2="88"/>'
    + '<line x1="73" y1="38" x2="55" y2="52">'
    +   '<animate attributeName="x2" values="55;88;55" dur=".5s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'
    +   '<animate attributeName="y2" values="52;70;52" dur=".5s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'
    + '</line>'
    + '</g>');
}

/* 3. Skip Alto */
function svgSkipAlto() {
  return mkSVG('<g ' + SW + '>'
    + '<circle cx="50" cy="11" r="7"/>'
    + '<line x1="50" y1="18" x2="50" y2="54"/>'
    + '<line x1="50" y1="28" x2="30" y2="44">'
    +   '<animate attributeName="y2" values="44;24;44" dur=".44s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'
    + '</line>'
    + '<line x1="50" y1="28" x2="70" y2="44">'
    +   '<animate attributeName="y2" values="24;44;24" dur=".44s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'
    + '</line>'
    + '<line x1="50" y1="54" x2="40" y2="72">'
    +   '<animate attributeName="y2" values="72;46;72" dur=".44s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'
    +   '<animate attributeName="x2" values="40;44;40" dur=".44s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'
    + '</line>'
    + '<line x1="50" y1="54" x2="60" y2="72">'
    +   '<animate attributeName="y2" values="46;72;46" dur=".44s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'
    +   '<animate attributeName="x2" values="56;60;56" dur=".44s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'
    + '</line>'
    + '</g>');
}

/* 4. Burpees */
function svgBurpees() {
  return mkSVG('<g ' + SW + '>'
    + '<circle cx="50" cy="11" r="7">'
    +   '<animate attributeName="cy" values="11;34;11" dur=".9s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'
    + '</circle>'
    + '<line x1="50" y1="18" x2="50" y2="52">'
    +   '<animate attributeName="y1" values="18;41;18" dur=".9s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'
    +   '<animate attributeName="y2" values="52;66;52" dur=".9s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'
    + '</line>'
    + '<line x1="50" y1="28" x2="27" y2="13">'
    +   '<animate attributeName="y1" values="28;50;28" dur=".9s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'
    +   '<animate attributeName="y2" values="13;64;13" dur=".9s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'
    + '</line>'
    + '<line x1="50" y1="28" x2="73" y2="13">'
    +   '<animate attributeName="y1" values="28;50;28" dur=".9s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'
    +   '<animate attributeName="y2" values="13;64;13" dur=".9s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'
    + '</line>'
    + '<line x1="50" y1="52" x2="37" y2="80">'
    +   '<animate attributeName="y1" values="52;66;52" dur=".9s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'
    +   '<animate attributeName="x2" values="37;28;37" dur=".9s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'
    +   '<animate attributeName="y2" values="80;92;80" dur=".9s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'
    + '</line>'
    + '<line x1="50" y1="52" x2="63" y2="80">'
    +   '<animate attributeName="y1" values="52;66;52" dur=".9s" repeatCount="indefinite" calcMode="spline" keySplines="' + E + '"/>'

/* ════════════════════════════════════
   EXERCISES — workTime per esercizio
════════════════════════════════════ */
var EXERCISES = [
  { name:'JUMPING JACKS',     num:'1 / 6', workTime:45, svg:svgJacks()    },
  { name:'MOUNTAIN CLIMBERS', num:'2 / 6', workTime:45, svg:svgClimbers() },
  { name:'SKIP ALTO',         num:'3 / 6', workTime:45, svg:svgSkipAlto() },
  { name:'BURPEES',           num:'4 / 6', workTime:45, svg:svgBurpees()  },
  { name:'PLANK TOCCA SPALLE',num:'5 / 6', workTime:45, svg:svgPlank()    },
  { name:'AIR SQUAT',         num:'6 / 6', workTime:30, svg:svgAirSquat() },
];
var NX = EXERCISES.length; // 6

/* ════════════════════════════════════
   STATE
════════════════════════════════════ */
var phase    = 'idle';
var round    = 0;
var timeLeft = EXERCISES[0].workTime;
var running  = false;
var ticker   = null;
var audioCtx = null;

/* ════════════════════════════════════
   AUDIO
════════════════════════════════════ */
function getACtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function tone(freq, dur, vol, type, delay) {
  vol=vol||.3; type=type||'square'; delay=delay||0;
  try {
    var ctx=getACtx(), o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type=type; o.frequency.setValueAtTime(freq, ctx.currentTime+delay);
    g.gain.setValueAtTime(vol, ctx.currentTime+delay);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+delay+dur);
    o.start(ctx.currentTime+delay); o.stop(ctx.currentTime+delay+dur+.01);
  } catch(e){}
}
function sfxTick() { tone(880,.07,.18); }
function sfxWork() { tone(1047,.1,.4,'square',0); tone(1319,.1,.4,'square',.12); tone(1568,.22,.45,'sine',.24); }
function sfxRest() { tone(660,.18,.35,'sine',0); tone(523,.22,.28,'sine',.2); }
function sfxSkip() { tone(1047,.08,.3,'sine'); tone(1319,.12,.3,'sine',.09); }
function sfxDone() {
  var f=[880,1047,1319,1047,1319,1568], t=[0,.15,.3,.45,.6,.85];
  for (var i=0;i<f.length;i++) tone(f[i],.2,.42,'sine',t[i]);
}

/* ════════════════════════════════════
   DOM
════════════════════════════════════ */
function $id(id) { return document.getElementById(id); }
var elPhaseLbl=$id('phase-lbl'), elCountNum=$id('count-num'), elNextLbl=$id('next-lbl');
var elRFg=$id('r-fg'), elFigWrap=$id('fig-wrap'), elExName=$id('ex-name');
var elExSub=$id('ex-sub'), elExHint=$id('ex-hint');
var elHdrRound=$id('hdr-round'), elHdrCirc=$id('hdr-circ');
var elDots=$id('dots'), elBtnMain=$id('btn-main'), elBtnSkip=$id('btn-skip');
var elGoOv=$id('go-ov'), elGoN=$id('go-n'), elDoneSc=$id('done-sc');
var elFlash=$id('flash'), elExPanel=$id('ex-panel'), elEpList=$id('ep-list');
var elNextBadge=$id('next-badge'), elSetPanel=$id('set-panel');

/* ════════════════════════════════════
   HELPERS
════════════════════════════════════ */
function exAt(r)   { return EXERCISES[r % NX]; }
function workTime(){ return exAt(round).workTime; }

function setColor(hex) { document.documentElement.style.setProperty('--c', hex); }

function updateRing() {
  var total = phase === 'rest' ? REST_T : workTime();
  elRFg.style.strokeDashoffset = String(CIRC * (1 - timeLeft / total));
}

/* ════════════════════════════════════
   RENDER
════════════════════════════════════ */
function render() {
  var circuit = Math.floor(round / NX) + 1;

  elHdrRound.textContent = 'Round ' + (round+1) + ' / ' + TOTAL_R;
  elHdrCirc.textContent  = 'Circuito ' + circuit + ' / 3';

  elCountNum.textContent = timeLeft;
  elCountNum.classList.toggle('pulse', running && timeLeft <= 3 && timeLeft > 0);

  if (phase === 'idle') {
    var ex = exAt(round);
    elExName.textContent = ex.name;
    elExSub.textContent  = 'ESERCIZIO ' + ex.num;
    elExHint.textContent = ex.workTime + '" LAVORO \u00B7 ' + REST_T + '" PAUSA';
    elFigWrap.innerHTML  = ex.svg;
    elNextBadge.style.display = 'none';
    elPhaseLbl.textContent       = 'PRONTO';
    elNextLbl.textContent        = 'premi INIZIA per partire';
    elRFg.style.strokeDashoffset = '0';
    setColor('#FFD600');
  } else if (phase === 'work') {
    var ex = exAt(round);
    elExName.textContent = ex.name;
    elExSub.textContent  = 'ESERCIZIO ' + ex.num;
    elExHint.textContent = ex.workTime + '" LAVORO \u00B7 ' + REST_T + '" PAUSA';
    elFigWrap.innerHTML  = ex.svg;
    elNextBadge.style.display = 'none';
    elPhaseLbl.textContent = 'LAVORA';
    elNextLbl.textContent  = round >= TOTAL_R-1 ? 'ULTIMO ROUND!' : 'poi \u2192 RIPOSA ' + REST_T + '"';
    setColor('#FFD600');
    updateRing();
  } else if (phase === 'rest') {
    var nxt = exAt(round+1);
    elExName.textContent = nxt.name;
    elExSub.textContent  = 'ESERCIZIO ' + nxt.num;
    elExHint.textContent = 'PREPARATI!';
    elFigWrap.innerHTML  = nxt.svg;
    elNextBadge.style.display = 'block';
    elPhaseLbl.textContent = 'RIPOSA';
    elNextLbl.textContent  = 'prossimo esercizio';
    setColor('#00E5FF');
    updateRing();
  }

  buildDots();

  elBtnSkip.disabled = (phase === 'idle' || phase === 'done');

  if (phase === 'done') {
    elBtnMain.textContent = '\u2713 COMPLETO';
    elBtnMain.disabled    = true;
  } else {
    elBtnMain.disabled    = false;
    elBtnMain.textContent = running
      ? '\u23F8 PAUSA'
      : (phase === 'idle' ? '\u25B6 INIZIA' : '\u25B6 RIPRENDI');
  }
}

function buildDots() {
  elDots.innerHTML = '';
  for (var i=0; i<TOTAL_R; i++) {
    var d = document.createElement('div');
    var c = 'dot';
    if (i < round)        c += ' done';
    else if (i === round)  c += ' active';
    d.className = c;
    elDots.appendChild(d);
  }
}

/* ════════════════════════════════════
   EXERCISES PANEL
════════════════════════════════════ */
function openPanel()  { buildPanel(); elExPanel.classList.add('show'); }
function closePanel() { elExPanel.classList.remove('show'); }

function buildPanel() {
  elEpList.innerHTML = '';
  var exIdx = round % NX;
  for (var i=0; i<EXERCISES.length; i++) {
    var ex        = EXERCISES[i];
    var isCurrent = (i === exIdx) && (phase !== 'idle') && (phase !== 'done');
    var isDone    = (phase !== 'idle' && phase !== 'done') && (i < exIdx);

    var item = document.createElement('div');
    item.className = 'ep-item' + (isCurrent ? ' ep-current' : '') + (isDone ? ' ep-done' : '');

    var figDiv = document.createElement('div');
    figDiv.className = 'ep-fig';
    figDiv.innerHTML = ex.svg;
    item.appendChild(figDiv);

    var info = document.createElement('div');
    info.className = 'ep-info';
    info.innerHTML =
      '<div class="ep-name">' + ex.name + '</div>'
      + '<div class="ep-meta">' + ex.workTime + '" LAVORO \u00B7 ' + REST_T + '" PAUSA \u00B7 3\u00D7</div>';
    item.appendChild(info);

    if (isCurrent) {
      var b = document.createElement('span');
      b.className   = 'ep-badge';
      b.textContent = phase === 'work' ? 'ADESSO' : 'PAUSA';
      item.appendChild(b);
    } else if (isDone) {
      var b2 = document.createElement('span');
      b2.className   = 'ep-badge done-badge';
      b2.textContent = '\u2713';
      item.appendChild(b2);
    }
    elEpList.appendChild(item);
  }
}

/* ════════════════════════════════════
   SETTINGS PANEL
════════════════════════════════════ */
function openSettings() {
  document.getElementById('sp-work').value = EXERCISES[0].workTime;
  document.getElementById('sp-work-val').textContent = EXERCISES[0].workTime;
  document.getElementById('sp-rest').value = REST_T;
  document.getElementById('sp-rest-val').textContent = REST_T;
  elSetPanel.classList.add('show');
}
function closeSettings() { elSetPanel.classList.remove('show'); }

function applySettings() {
  var newWork = parseInt(document.getElementById('sp-work').value, 10);
  var newRest = parseInt(document.getElementById('sp-rest').value, 10);
  REST_T = newRest;
  for (var i = 0; i < EXERCISES.length; i++) EXERCISES[i].workTime = newWork;
  if (phase === 'idle') timeLeft = newWork;
  closeSettings();
  render();
}

/* ════════════════════════════════════
   TIMER ENGINE
════════════════════════════════════ */
function tick() {
  timeLeft--;
  if (timeLeft > 0 && timeLeft <= 3) sfxTick();
  if (timeLeft <= 0) transitionPhase();
  render();
}

function transitionPhase() {
  if (phase === 'work') {
    if (round >= TOTAL_R-1) { endWorkout(); return; }
    phase = 'rest'; timeLeft = REST_T;
    sfxRest(); doFlash('#00e5ff');
  } else {
    round++; phase = 'work'; timeLeft = exAt(round).workTime;
    sfxWork(); doFlash('#ffd600');
  }
}

function doFlash(color) {
  elFlash.style.background = color;
  elFlash.style.opacity    = '.18';
  elFlash.classList.remove('go');
  void elFlash.offsetWidth;
  elFlash.classList.add('go');
}

/* ════════════════════════════════════
   CONTROLS
════════════════════════════════════ */
function toggleStart() {
  if (phase === 'done') return;
  if (!running) {
    running = true;
    if (phase === 'idle') {
      phase = 'work'; timeLeft = exAt(0).workTime; // 45"
      render();
      startCountdown(function() {
        sfxWork(); doFlash('#ffd600');
        ticker = setInterval(tick, 1000);
        render();
      });
    } else {
      ticker = setInterval(tick, 1000);
      render();
    }
  } else {
    running = false;
    clearInterval(ticker); ticker = null;
    render();
  }
}

function skipPhase() {
  if (phase === 'idle' || phase === 'done') return;
  sfxSkip();
  clearInterval(ticker); ticker = null;
  transitionPhase();
  render();
  if (running && phase !== 'done') ticker = setInterval(tick, 1000);
}

function resetAll() {
  running = false;
  clearInterval(ticker); ticker = null;
  phase = 'idle'; round = 0; timeLeft = EXERCISES[0].workTime;
  elDoneSc.classList.remove('show');
  elExPanel.classList.remove('show');
  setColor('#FFD600');
  render();
}

function endWorkout() {
  running = false; clearInterval(ticker); ticker = null;
  phase = 'done'; sfxDone();
  setTimeout(function() { elDoneSc.classList.add('show'); }, 700);
  render();
}

function startCountdown(cb) {
  var n = 3;
  elGoOv.classList.add('show'); showGoNum(n);
  var iv = setInterval(function() {
    n--;
    if (n <= 0) { clearInterval(iv); elGoOv.classList.remove('show'); cb(); }
    else showGoNum(n);
  }, 1000);
}
function showGoNum(n) {
  elGoN.textContent = n;
  elGoN.style.animation = 'none'; void elGoN.offsetWidth; elGoN.style.animation = '';
  sfxTick();
}

/* ════════════════════════════════════
   SPOTIFY
   Cambia SPOTIFY_URL con la tua playlist preferita
════════════════════════════════════ */
var SPOTIFY_URL = 'https://open.spotify.com/playlist/37i9dQZF1DWUVpAXiEPK8P'; // Beast Mode

function openSpotify() {
  window.open(SPOTIFY_URL, '_blank');
}

/* ════════════════════════════════════
   INIT
════════════════════════════════════ */
render();
</script>
